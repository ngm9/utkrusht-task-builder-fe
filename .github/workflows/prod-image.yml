name: Build & Push Task Builder FE Image — PROD (GHCR)

# Production counterpart of dev-image.yml. Differences, all deliberate:
#   branch      main    -> release
#   client tag  @dev    -> @latest
#   environment task-builder-fe-dev -> task-builder-fe-prod
#   image       ...-fe-dev          -> ...-fe-prod
#   webhook     COOLIFY_TASK_BUILDER_FE_DEV_...  -> ..._PROD_...
#
# The webhook secret name is spelled PROD on purpose. recruiter-utkrusht's
# app-image.yml calls COOLIFY_DEVAPP_DEPLOY_WEBHOOK from its prod environment,
# which only works if that environment silently overrides a dev-named secret —
# one missing override and a production build deploys the dev app.
on:
  workflow_run:
    workflows: ["CI"]
    branches: [release]
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

concurrency:
  group: task-builder-fe-prod
  cancel-in-progress: false   # never cancel a prod deploy mid-flight

jobs:
  build:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    environment: task-builder-fe-prod
    runs-on: [self-hosted, udev1]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3
        with:
          name: persistent-builder
          cleanup: false

      - name: Resolve recruiter-client version (@latest)
        id: client
        # @latest, NOT @dev — prod must build against the stable channel.
        run: |
          set -euo pipefail
          VER=$(curl -fsS \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://npm.pkg.github.com/@ngm9%2Frecruiter-client" | jq -r '."dist-tags".latest')
          [ -n "$VER" ] && [ "$VER" != "null" ] || { echo "::error::could not resolve @ngm9/recruiter-client@latest"; exit 1; }
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "Resolved @ngm9/recruiter-client@latest -> $VER"

      - name: Preflight — does the stable client expose the task-builder API?
        # As of 2026-07, @latest is 2.0.0 and carries NO task-builder operations:
        # those routes reached main after 2.0.0 was cut, so they exist only on
        # the @dev channel. Without this check the build dies deep in rollup
        # with "does not provide an export named 'getTaskBuilderGreeting'",
        # which reads like a frontend bug and is not one.
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VER="${{ steps.client.outputs.version }}"
          npm pack "@ngm9/recruiter-client@${VER}" --pack-destination /tmp/rc >/dev/null
          tar xzf /tmp/rc/*.tgz -C /tmp/rc
          if ! grep -rq 'getTaskBuilderGreeting' /tmp/rc/package; then
            echo "::error::@ngm9/recruiter-client@${VER} (the @latest channel) has no task-builder operations."
            echo "::error::This frontend cannot be built for production until a STABLE client carrying them is published."
            echo "::error::That needs the backend's task-builder routes cut to its release channel first — see recruiter-client's publish workflow."
            exit 1
          fi
          echo "OK: @latest ($VER) exposes the task-builder operations."
          rm -rf /tmp/rc

      - name: Build and push (task-builder-fe prod)
        uses: docker/build-push-action@v6
        with:
          builder: ${{ steps.buildx.outputs.name }}
          platforms: linux/arm64
          provenance: false
          sbom: false
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/ngm9/utkrusht-task-builder-fe-prod:latest
            ghcr.io/ngm9/utkrusht-task-builder-fe-prod:sha-${{ github.event.workflow_run.head_sha || github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # No VITE_* here: the app is configured at RUNTIME from the
          # deployment's own environment (docker-entrypoint.sh -> /env.js), so
          # the image carries no environment-specific values and the same build
          # can run anywhere. CLIENT_VERSION stays a build arg because it picks
          # an npm dependency.
          build-args: |
            CLIENT_VERSION=${{ steps.client.outputs.version }}
          secrets: |
            node_auth_token=${{ secrets.GITHUB_TOKEN }}

      - name: Clean up disk space for Trivy
        run: |
          echo "=== Disk usage before cleanup ==="
          df -h /
          docker buildx prune --force --all 2>/dev/null || true
          sudo find /tmp -maxdepth 1 -name 'trivy-*' -type d -exec rm -rf {} + 2>/dev/null || true
          sudo rm -rf /tmp/trivy-cache-task-builder-fe-prod/db 2>/dev/null || true
          docker system prune -af --volumes 2>/dev/null || true
          echo "=== Disk usage after cleanup ==="
          df -h /

      - name: Install Trivy
        run: |
          if ! command -v trivy &>/dev/null; then
            curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sudo sh -s -- -b /usr/local/bin
          fi

      - name: Run Trivy vulnerability scan
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          trivy image \
            --image-src remote \
            --scanners vuln,misconfig \
            --severity CRITICAL,HIGH \
            --format sarif \
            --output trivy-results.sarif \
            --exit-code 0 \
            --cache-dir /tmp/trivy-cache-task-builder-fe-prod \
            ghcr.io/ngm9/utkrusht-task-builder-fe-prod:latest

      - name: Upload Trivy scan results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-task-builder-fe-prod
          path: trivy-results.sarif
          retention-days: 90

      - name: Clean up Trivy temp files
        if: always()
        run: |
          sudo find /tmp -maxdepth 1 -name 'trivy-*' -type d -exec rm -rf {} + 2>/dev/null || true
          sudo rm -rf /tmp/trivy-cache-task-builder-fe-prod/db 2>/dev/null || true

      - name: Trigger Coolify deploy
        run: |
          curl -fsS -X GET \
          -H "Authorization: Bearer ${{ secrets.COOLIFY_DEPLOY_API_TOKEN }}" \
          "${{ secrets.COOLIFY_TASK_BUILDER_FE_PROD_DEPLOY_WEBHOOK }}"

      - name: Prune buildx cache
        if: always()
        run: docker buildx prune --force --all 2>/dev/null || true
