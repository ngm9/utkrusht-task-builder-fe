server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SPA: fall back to index.html for client-side routes.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Long-cache the hashed build assets.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Runtime config, rewritten on every container start. MUST NOT be cached —
  # a cached copy would keep pointing returning visitors at the old backend
  # after a config change, which is the whole point of injecting at runtime.
  location = /env.js {
    add_header Cache-Control "no-store, no-cache, must-revalidate";
    expires -1;
  }
}
